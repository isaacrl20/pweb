<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Galeria de Imagens</title>
  <style>
    body {
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 900px;
      margin: 30px auto;
      background: #d6d6d6;
      padding: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .galeria {
      background: #fff;
      width: 180px;
      padding: 5px;
      margin: 10px;
      float: left;
      border: 3px solid #999; /* borda padronizada */
      box-sizing: border-box;
    }

    .galeria img {
      width: 100%;
      display: block;
    }

    .galeria p {
      margin: 5px 0;
      text-align: center;
    }

    .texto {
      clear: both;
      text-align: justify;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Primeira linha -->
    <div class="galeria">
      <img src="img/militar-amigo.jpg" alt="Imagem 1">
      <p>Resumo</p>
    </div>

    <div class="galeria">
      <img src="img/OIP.webp" alt="Imagem 2">
      <p>Resumo</p>
    </div>

    <div class="galeria">
      <img src="img/mobile-phone-mockup-in-hand-Graphics-33424682-1-580x387.jpg" alt="Imagem 3">
      <p>Resumo</p>
    </div>

    <div class="galeria">
      <img src="img/OIP.jpg" alt="Imagem 4">
      <p>Resumo</p>
    </div>

    <!-- Segunda linha: criança movida para a direita -->
    <div class="galeria">
      <img src="img/OIP (1).webp" alt="Imagem 5">
      <p>Resumo</p>
    </div>

    <p class="texto">
      Lorem Ipsum é simplesmente uma simulação de texto da indústria tipográfica e de impressos. 
      Lorem Ipsum vem sendo utilizado desde o século XVI, quando um impressor desconhecido pegou 
      uma bandeja de tipos e a embaralhou para fazer um livro de modelos de tipos.
    </p>

  </div>
</body>
</html>
