<h1>Buscar Pacotes de Viagem</h1>

<form>
    <label>Origem</label><br>
    <input type="text" name="origem" placeholder="Cidade de origem"><br><br>

    <label>Destino</label><br>
    <input type="text" name="destino" placeholder="Cidade de destino"><br><br>

    <label>Data de Partida</label><br>
    <input type="date" name="data_partida"><br><br>

    <label>Data de Retorno</label><br>
    <input type="date" name="data_retorno"><br><br>

    <label>Quartos</label><br>
    <select name="quartos">
        <option>1</option>
        <option>2</option>
        <option>3</option>
    </select><br><br>

    <label>Adultos</label><br>
    <select name="adultos">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
    </select><br><br>

    <label>Crianças</label><br>
    <select name="criancas">
        <option>0</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
    </select><br><br>


    <button type="button">Enviar</button>
