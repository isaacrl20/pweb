<h1>Buscar Pacotes de Viagem</h1>

<form>
    <!-- Origem e Destino lado a lado -->
    <div class="campo">
        <label>Origem</label>
        <input type="text" name="origem" placeholder="Cidade de origem">
    </div>

    <div class="campo">
        <label>Destino</label>
        <input type="text" name="destino" placeholder="Cidade de destino">
    </div>

    <div class="campo">
        <label>Data de Partida</label>
        <input type="date" name="data_partida">
    </div>

    <div class="campo">
        <label>Data de Retorno</label>
        <input type="date" name="data_retorno">
    </div>

    <div class="campo">
        <label>Quartos</label>
        <select name="quartos">
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
    </div>

    <div class="campo">
        <label>Adultos</label>
        <select name="adultos">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
        </select>
    </div>

    <div class="campo">
        <label>Crianças</label>
        <select name="criancas">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
    </div>

    <button type="button">Enviar</button>
</form>
