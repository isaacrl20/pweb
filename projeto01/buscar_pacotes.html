<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Buscar Pacotes</title>
<style>
table {
    width: 100%;
}
form {
    display: grid;
    grid-template-columns: 1fr 1fr; /* duas colunas */
    gap: 20px;
}
.campo {
    display: flex;
    flex-direction: column;
}
input, select {
    padding: 10px;
    margin-top: 5px;
}
button {
    grid-column: span 2; /* botão ocupa as duas colunas */
    padding: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
img.banner {
    width: 100%;
    height: 300px; /* altura padrão */
    object-fit: cover; /* mantém proporção */
}
</style>
</head>
<body>

<table>
  <tr>
    <td>
      <img src="img/logo.png"/>
    </td>
    <td align="right">
      <a href="index.html">Home</a> |
      <a href="Quem_somos.html">Quem somos</a> |
      <a href="contato.html">Contato</a> |
      <a href="buscar_pacotes.html">Buscar pacotes</a> |
      <a href="destinos.html">Destinos</a>
    </td>
  </tr>
</table>

<!-- imagem padrão -->
<tr>
  <td colspan="2">
    <img src="img/Copilot_20260526_220625.png" class="banner"/>
  </td>
</tr>

<h1>Buscar Pacotes de Viagem</h1>

<form action="https://qfqdkj.hospedagemelastica.com.br/pweb/salvar.jsp" method="POST">
    <div class="campo">
        <label>Origem</label>
        <input type="text" name="origem" placeholder="Cidade de origem">
    </div>

    <div class="campo">
        <label>Destino</label>
        <input type="text" name="destino" placeholder="Cidade de destino">
    </div>

    <div class="campo">
        <label>Data de Partida</label>
        <input type="date" name="data_partida">
    </div>

    <div class="campo">
        <label>Data de Retorno</label>
        <input type="date" name="data_retorno">
    </div>

    <div class="campo">
        <label>Quartos</label>
        <select name="quartos">
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
    </div>

    <div class="campo">
        <label>Adultos</label>
        <select name="adultos">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
        </select>
    </div>

    <div class="campo">
        <label>Crianças</label>
        <select name="criancas">
            <option>0</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
        </select>
    </div>

    <button type="submit">Buscar</button>
</form>

</body>
</html>
