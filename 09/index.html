<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Atividade 09 - Posicionamento</title>
  <style>
    /* Fundo geral */
    body {
      background: #61bd8c;
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
    }

    /* Container principal */
    #conteudo {
      background: #FFFFFF;
      padding: 10px;
      width: 900px;
      margin: 30px auto; /* centraliza horizontalmente */
      text-align: center;
    }

    /* Classe caixa */
    .caixa {
      background: red;
      margin: 10px;
      width: 100px;
      height: 100px;
      color: #FFFFFF;
      line-height: 100px;
      font-weight: bold;
      display: inline-block;
    }

    /* Tipos de posicionamento */
    #relativo {
      position: relative;
      left: 30px;
    }

    #absoluto {
      position: absolute;
      left: 30px;
    }

    #fixo {
      position: fixed;
      left: 200px;
      top: 0px;
    }
  </style>
</head>

<body>
  <span>Container body</span>

  <div id="conteudo">
    Container div

    <div id="relativo" class="caixa">Relativo</div>
    <div id="absoluto" class="caixa">Absoluto</div>
    <div id="fixo" class="caixa">Fixo</div>
  </div>
</body>
</html>
