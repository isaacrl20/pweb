<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Desafio Opcional - Posicionamento</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: space-around; /* coloca os dois layouts lado a lado */
    }

    /* Container geral de cada layout */
    .layout {
      background-color: #fff;
      width: 45%;
      border: 2px solid #333;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Layout 1 - Fixar Header */
    .header {
      position: fixed;
      top: 0;
      width: 45%;
      height: 80px;
      background-color: #4682B4;
      color: white;
      text-align: center;
      line-height: 80px;
      font-weight: bold;
      font-size: 1.3em;
    }

    .menu {
      background-color: #FF8C00;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      margin-top: 100px;
    }

    .left, .center, .right {
      float: left;
      height: 300px;
    }

    .left {
      width: 25%;
      background-color: #FFD700;
    }

    .center {
      width: 50%;
      background-color: #90EE90;
    }

    .right {
      width: 25%;
      background-color: #FFA07A;
    }

    .footer {
      clear: both;
      background-color: #9370DB;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    /* Layout 2 - Fixar Side Bar */
    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 200px;
      height: 100%;
      background-color: #2F4F4F;
      color: white;
      text-align: center;
      line-height: 2em;
      font-weight: bold;
    }

    .content {
      margin-right: 220px;
      background-color: #32CD32;
      padding: 20px;
      height: 400px;
    }

    .footer2 {
      background-color: #8B0000;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    /* Títulos */
    h2 {
      text-align: center;
      background-color: #333;
      color: white;
      margin: 0;
      padding: 10px;
    }
  </style>
</head>

<body>
  <!-- Layout 1: Fixar Header -->
  <div class="layout">
    <h2>Fixar Header</h2>
    <div class="header">HEADER FIXO</div>
    <div class="menu">MENU</div>
    <div class="left">LEFT</div>
    <div class="center">CENTER</div>
    <div class="right">RIGHT</div>
    <div class="footer">FOOTER</div>
  </div>

  <!-- Layout 2: Fixar Side Bar -->
  <div class="layout">
    <h2>Fixar Side Bar</h2>
    <div class="sidebar">SIDE BAR</div>
    <div class="content">CONTEÚDO PRINCIPAL</div>
    <div class="footer2">FOOTER</div>
  </div>
</body>
</html>
