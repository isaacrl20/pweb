<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício - Efeito CSS3</title>
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 40px;
        }

        h1 {
            color: #00796b;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        /* Configuração geral das formas */
        .shape {
            width: 100px;
            height: 100px;
            box-sizing: border-box;
            display: inline-block;
        }

        /* Flor com quatro pétalas */
        .flower {
            display: grid;
            grid-template-columns: repeat(2, 100px);
            grid-template-rows: repeat(2, 100px);
            gap: 0;
        }

        .flower div {
            width: 100px;
            height: 100px;
            box-sizing: border-box;
        }

        .red {
            background-color: red;
            border-radius: 100px 0 0 0;
        }

        .orange {
            background-color: orange;
            border-radius: 0 100px 0 0;
        }

        .green {
            background-color: green;
            border-radius: 0 0 0 100px;
        }

        .purple {
            background-color: purple;
            border-radius: 0 0 100px 0;
        }

        /* Círculo dividido em quatro partes */
        .circle {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
        }

        .circle div {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .circle .red {
            background-color: red;
            top: 0;
            left: 0;
        }

        .circle .orange {
            background-color: orange;
            top: 0;
            left: 100px;
        }

        .circle .green {
            background-color: green;
            top: 100px;
            left: 0;
        }

        .circle .purple {
            background-color: purple;
            top: 100px;
            left: 100px;
        }
    </style>
</head>
<body>
    <h1>Exercício - Efeito com CSS3</h1>
    <div class="container">
        <!-- Flor -->
        <div class="flower">
            <div class="red"></div>
            <div class="orange"></div>
            <div class="green"></div>
            <div class="purple"></div>
        </div>

        <!-- Círculo dividido -->
        <div class="circle">
            <div class="red"></div>
            <div class="orange"></div>
            <div class="green"></div>
            <div class="purple"></div>
        </div>
    </div>
</body>
</html>
