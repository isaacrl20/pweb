<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício - Flor e Círculo CSS3</title>
    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 40px;
        }

        h1 {
            color: #00796b;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        /* Configuração geral das formas */
        .shape {
            width: 100px;
            height: 100px;
            box-sizing: border-box;
        }

        /* Flor com quatro pétalas */
        .flower {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .flower div {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        /* Cada pétala: três cantos arredondados (50%) e o canto
           voltado para o centro da flor com raio 0, formando o
           formato de "gota" que aponta para o meio */
        .flower .red {
            background-color: red;
            top: 0;
            left: 0;
            border-radius: 50% 50% 0 50%;
        }

        .flower .orange {
            background-color: orange;
            top: 0;
            left: 100px;
            border-radius: 50% 50% 50% 0;
        }

        .flower .green {
            background-color: green;
            top: 100px;
            left: 0;
            border-radius: 50% 0 50% 50%;
        }

        .flower .purple {
            background-color: purple;
            top: 100px;
            left: 100px;
            border-radius: 0 50% 50% 50%;
        }

        /* Círculo dividido em quatro partes */
        .circle {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
        }

        .circle div {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .circle .red {
            background-color: red;
            top: 0;
            left: 0;
        }

        .circle .orange {
            background-color: orange;
            top: 0;
            left: 100px;
        }

        .circle .green {
            background-color: green;
            top: 100px;
            left: 0;
        }

        .circle .purple {
            background-color: purple;
            top: 100px;
            left: 100px;
        }
    </style>
</head>
<body>
    <h1>Exercício - Flor e Círculo com CSS3</h1>
    <div class="container">
        <!-- Flor -->
        <div class="flower">
            <div class="red"></div>
            <div class="orange"></div>
            <div class="green"></div>
            <div class="purple"></div>
        </div>

        <!-- Círculo dividido -->
        <div class="circle">
            <div class="red"></div>
            <div class="orange"></div>
            <div class="green"></div>
            <div class="purple"></div>
        </div>
    </div>
</body>
</html>
