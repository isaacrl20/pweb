<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
  <title>Minha primeira página CSS</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      color: purple;
      background-color: #d8da3d;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    ul.navbar {
      list-style-type: none;
      padding: 0;
      margin: 0;
      position: absolute;
      top: 2em;
      left: 1em;
      width: 9em;
      text-align: left;
    }

    h1 {
      font-family: Helvetica, Geneva, Arial, SunSans-Regular, sans-serif;
      margin: 0.5em 0;
    }

    p {
      margin: 0.5em 0 1em 0;
    }

    ul.navbar li {
      background: white;
      margin: 0.5em 0;
      padding: 0.3em;
      border-right: 1em solid black;
    }

    ul.navbar a {
      text-decoration: none;
      display: block;
      padding-bottom: 0.3em;
    }

    a:link {
      color: blue;
    }

    a:visited {
      color: purple;
    }

    /* Conteúdo logo abaixo do link Contato */
    .conteudo {
      margin-top: 8em; /* posiciona abaixo do menu */
    }

    .linha {
      border-top: 2px solid purple; /* linha roxa traçada */
      width: 100%;
      margin: 1em auto;
    }

    address {
      font-style: italic;
    }
  </style>
</head>

<body>
  <ul class="navbar">
    <li><a href="index.html">Home page</a></li>
    <li><a href="links.html">Links</a></li>
    <li><a href="contato.html">Contato</a></li>
  </ul>

  <div class="conteudo">
    <h1>Minha primeira página CSS</h1>
    <p>Bem-vindo à minha página estilizada!</p>

    <div class="linha"></div>

    <address>
      Construída em janeiro de 2004<br>
      por mim mesmo.
    </address>
  </div>
</body>
</html>
