<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafio: Criando uma Página Web com div</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  padding: 40px 20px;
  background-color: #f4f4f9;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Moldura Verde Escura Externa */
.moldura-principal {
  background-color: #0b5a30;
  width: 100%;
  max-width: 900px;
  padding: 20px;
  border-radius: 4px;
}

/* Cabeçalho */
.header {
  background-color: #118244;
  color: white;
  text-align: center;
  padding: 25px;
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
  border: 2px solid #ffffff;
}

/* Container principal */
.main-container {
  display: flex;
  margin-bottom: 20px;
  gap: 20px;
}

/* Barra lateral */
.sidebar {
  background-color: #ffffff;
  width: 25%;
  padding: 15px;
  border: 1px solid #b0c4de;
  min-height: 250px;
}

/* Flex para links + itens */
.sidebar-flex {
  display: flex;
  flex-direction: row; /* lado a lado */
  justify-content: space-between;
  gap: 20px;
}

/* Links da barra lateral */
.links a {
  display: block;
  background-color: #e0e0e0;
  color: #0b5a30;
  text-decoration: none;
  font-weight: bold;
  padding: 10px;
  margin-bottom: 10px;
  border-left: 10px solid #000;
  transition: background-color 0.3s;
}

.links a:hover {
  background-color: #c0c0c0;
}

/* Itens como texto normal */
.itens {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.itens span {
  margin-bottom: 10px;
  color: #333;
  font-weight: normal; /* texto simples */
}
  
/* Conteúdo principal */
.content {
  background-color: #ffffff;
  width: 75%;
  padding: 15px;
  border: 1px solid #b0c4de;
}

.content .quadro-cinza {
  background-color: #e0e0e0;
  padding: 15px;
  border: 1px solid #a0a0a0;
  height: 100%;
}

.content p {
  margin-bottom: 15px;
  color: #333;
  line-height: 1.5;
}

/* Rodapé */
.footer {
  background-color: #1a252f;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 14px;
}
</style>
</head>
<body>

<div class="moldura-principal">

  <div class="header">
    Minha Página Web
  </div>

  <div class="main-container">

    <div class="sidebar">
      <div class="sidebar-flex">
        <div class="links">
          <a href="index.html">Home page</a>
          <a href="#">Pensamentos</a>
          <a href="#">Minha cidade</a>
          <a href="#">Links</a>
          <a href="#">Desafio</a>
        </div>

        <div class="itens">
          <span>Item 1</span>
          <span>Item 2</span>
          <span>Item 3</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="quadro-cinza">
        <p>Este é o conteúdo principal da página.</p>
        <p>Adicione mais parágrafos ou elementos conforme necessário.</p>
      </div>
    </div>

  </div>

  <div class="footer">
    Rodapé da Página
  </div>

</div>

</body>
</html>
