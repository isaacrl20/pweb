<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício - CSS + Custom Data</title>
    <style>
        /* Classe base */
        .pessoa {
            color: red;
            font-family: Arial, sans-serif;
            margin: 5px;
        }

        /* Pessoa com idade 30 terá cor azul */
        .pessoa[data-idade='30'] {
            color: blue;
        }

        /* Pessoa com idade 40 terá cor roxa */
        .pessoa[data-idade='40'] {
            color: purple;
        }

        /* Adiciona texto antes e depois */
        .pessoa::before {
            content: "Nome: ";
            font-weight: bold;
        }

        .pessoa::after {
            content: " - Idade: " attr(data-idade) " Anos - C.P.F: " attr(data-cpf);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Lista de Pessoas</h1>
    <ul>
        <li class="pessoa" data-idade="20" data-cpf="999">João</li>
        <li class="pessoa" data-idade="30" data-cpf="888">José</li>
        <li class="pessoa" data-idade="40" data-cpf="777">Maria</li>
    </ul>
</body>
</html>

</html>
