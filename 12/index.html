<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício Final - Data + CSS + JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        h1 {
            color: #00796b;
            text-align: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
            width: 400px;
            margin: 0 auto;
        }

        .pessoa {
            margin: 8px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* Cor padrão */
        .pessoa {
            color: red;
        }

        /* Pessoa com idade 30 */
        .pessoa[data-idade='30'] {
            color: blue;
        }

        /* Pessoa com idade 40 */
        .pessoa[data-idade='40'] {
            color: purple;
        }

        /* Adiciona texto antes e depois */
        .pessoa::before {
            content: "Nome: ";
        }

        .pessoa::after {
            content: " - Idade: " attr(data-idade) " Anos - C.P.F: " attr(data-cpf);
        }
    </style>

    <script type="text/javascript">
        function mostravalor(componente){
            var nome = componente.textContent;
            var idade = componente.getAttribute('data-idade');
            var cpf = componente.getAttribute('data-cpf');
            alert("Nome: " + nome + "\nIdade: " + idade + " anos\nCPF: " + cpf);
        }
    </script>
</head>
<body>
    <h1>Lista de Pessoas</h1>
    <ul>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="20" data-cpf="999">João</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="30" data-cpf="888">José</li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="40" data-cpf="777">Maria</li>
    </ul>
</body>
</html>
