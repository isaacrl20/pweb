<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício com Data e JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        h1 {
            color: #00796b;
            text-align: center;
        }

        ul {
            list-style-type: none;
            padding: 0;
            width: 300px;
            margin: 0 auto;
        }

        li {
            background-color: #e0f2f1;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
        }

        li:hover {
            background-color: #b2dfdb;
        }
    </style>

    <script type="text/javascript">
        function mostravalor(componente){
            var valor = componente.getAttribute('data-idade');
            alert(valor);
        }
    </script>
</head>
<body>
    <h1>Lista de Pessoas</h1>
    <ul>
        <li onclick="mostravalor(this)" data-idade="20">João</li>
        <li onclick="mostravalor(this)" data-idade="30">José</li>
        <li onclick="mostravalor(this)" data-idade="40">Maria</li>
    </ul>
</body>
</html>
